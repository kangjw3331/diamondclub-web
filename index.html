<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DiamondClub</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; background: #0b1220; overflow: hidden;
      overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    /* 휴대폰(세로 화면)은 꽉 차게, PC처럼 가로가 넓은 화면은 세로 비율 상자로 */
    #unity-canvas { display: block; width: 100%; height: 100%; background: #0b1220; touch-action: none; outline: none; }
    @media (min-aspect-ratio: 7/10) { #unity-canvas { width: auto; height: 100%; aspect-ratio: 9 / 19.5; } }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 35%, #1b2a4a, #0b1220 70%); color: #fff; z-index: 10; }
    #loading h1 { margin: 0; font-size: 34px; letter-spacing: 3px; font-weight: 800; }
    #loading h1 span { color: #f2c230; }
    #bar { width: 62vw; max-width: 320px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e04a50, #f2c230); transition: width 0.2s; }
    #msg { font-size: 14px; color: #9fb3d1; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">
    <h1>DIAMOND <span>CLUB</span></h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">불러오는 중… 처음엔 조금 걸려요</div>
  </div>
  <script>
    // iOS 사파리의 화면 끌림·두 번 탭 확대 막기
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Web.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "DiamondClub",
      productVersion: "0.1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), // 휴대폰 발열·속도를 위해 최대 2배
    };
    var canvas = document.querySelector("#unity-canvas");
    var fill = document.querySelector("#fill"), msg = document.querySelector("#msg"), loading = document.querySelector("#loading");
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        fill.style.width = Math.round(p * 100) + "%";
        if (p >= 0.9) msg.textContent = "경기장 준비 중…";
      }).then(function () {
        loading.style.transition = "opacity 0.4s"; loading.style.opacity = "0";
        setTimeout(function () { loading.remove(); }, 450);
      }).catch(function (m) { msg.textContent = "실행 오류: " + m; });
    };
    script.onerror = function () { msg.textContent = "파일을 불러오지 못했어요. 새로고침해 주세요."; };
    document.body.appendChild(script);
  </script>
</body>
</html>
